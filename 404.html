<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه پیدا نشد</title>
<link rel="stylesheet" href="/arabic/assets/fonts.css">
<style>body{font-family:'Vazirmatn',system-ui,sans-serif;background:#f5f2eb;color:#0f172a;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#785a0e;font-weight:700}</style>
</head>
<body><main><h1>۴۰۴ — صفحه پیدا نشد</h1><p><a id="home" href="./">بازگشت به فهرست</a></p></main>
<script>
  /* مسیر ریشهٔ سایت را از مسیر فعلی (GitHub Pages: /نام-مخزن/) حدس می‌زند */
  var seg = location.pathname.split('/').filter(Boolean)[0];
  var root = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
  document.getElementById('home').href = root;
  var l = document.querySelector('link[rel=stylesheet]'); l.href = root + 'assets/fonts.css';
</script></body>
</html>
