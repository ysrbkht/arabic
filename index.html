<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="ارائه‌های تعاملی گام‌به‌گام و لوح‌های آموزشی آمادهٔ چاپ برای تدریس قواعد زبان عربی">
<title>قواعد اللغة العربیة — کتابخانه تعاملی</title>
<meta name="theme-color" content="#b48a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* استایل ویژه بخش‌بندی صفحه اصلی */
  .hub-section { margin-bottom: clamp(32px, 5vw, 56px); }
  .hub-section:last-child { margin-bottom: 0; }

  .hub-section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--line);
  }
  .hub-section-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 22px;
    background: var(--tint);
    border: 1px solid var(--tint-strong);
    flex-shrink: 0;
  }
  .hub-section-title {
    margin: 0;
    font-size: clamp(18px, 1.8vw, 24px);
    font-weight: 800;
    color: var(--primary);
    line-height: 1.4;
  }
  .hub-section-sub {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--ink-muted);
    font-weight: 500;
  }
  .hub-section-count {
    margin-inline-start: auto;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .hub-empty { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--ink-muted); font-size: 14px; }
</style>
</head>
<body class="hub-body">
  <button class="hub-theme" id="hubTheme" title="تغییر تم روشن/تیره" aria-label="تغییر تم">🌙</button>

  <div class="hub">
    <header class="hub-head">
      <span class="hub-badge">قواعد اللغة العربیة</span>
      <h1 class="hub-title">کتابخانه تعاملی قواعد عربی</h1>
      <p class="hub-sub">ارائه‌های گام‌به‌گام برای تدریس زنده، و لوح‌های آمادهٔ چاپ و دانلود با کیفیت بالا.</p>
      <div class="hub-search">
        <input id="hubSearch" type="search" placeholder="جستجوی قاعده یا لوح…" autocomplete="off" aria-label="جستجو">
      </div>
    </header>

    <main class="hub-content">
      <noscript><p class="hub-empty">برای نمایش فهرست، جاوااسکریپت مرورگر باید فعال باشد.</p></noscript>
      <section class="hub-section" id="sec-deck">
        <div class="hub-section-head">
          <span class="hub-section-icon">🎓</span>
          <div>
            <h2 class="hub-section-title">ارائه‌های تعاملی</h2>
            <p class="hub-section-sub">گام‌به‌گام، با کارگاه و آزمون کلاسی</p>
          </div>
          <span class="hub-section-count" id="countDeck"></span>
        </div>
        <div class="hub-grid" id="deckGrid"></div>
      </section>

      <section class="hub-section" id="sec-poster">
        <div class="hub-section-head">
          <span class="hub-section-icon">📜</span>
          <div>
            <h2 class="hub-section-title">لوح‌های آموزشی</h2>
            <p class="hub-section-sub">آمادهٔ چاپ و دانلود با کیفیت بالا</p>
          </div>
          <span class="hub-section-count" id="countPoster"></span>
        </div>
        <div class="hub-grid" id="posterGrid"></div>
      </section>
    </main>

    <footer class="hub-foot" id="hubFoot"></footer>
  </div>

  <script src="assets/rules.js"></script>
  <script>
    (function () {
      const deckGrid = document.getElementById('deckGrid');
      const posterGrid = document.getElementById('posterGrid');
      const countDeck = document.getElementById('countDeck');
      const countPoster = document.getElementById('countPoster');
      const foot = document.getElementById('hubFoot');
      const search = document.getElementById('hubSearch');
      const secDeck = document.getElementById('sec-deck');
      const secPoster = document.getElementById('sec-poster');

      /* یکسان‌سازی متن برای جستجو: اعراب، ي/ی، ك/ک، أإآٱ/ا، ة/ه */
      const norm = t => String(t || '')
        .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
        .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک')
        .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه')
        .toLowerCase();

      function cardHTML(r) {
        const folder = r.type === 'poster' ? 'posters' : 'rules';
        const cta = r.type === 'poster' ? 'مشاهده لوح' : 'شروع ارائه';
        const badgeClass = r.type === 'poster' ? 'rule-badge poster' : 'rule-badge';
        return `
          <a class="rule-card ${r.type}" href="${folder}/${r.slug}.html">
            <span class="${badgeClass}">${r.badge}</span>
            <h2 class="rule-title">${r.title}</h2>
            <p class="rule-desc">${r.desc}</p>
            <span class="rule-cta">${cta} <span aria-hidden="true">←</span></span>
          </a>`;
      }

      function render(filter) {
        const f = norm((filter || '').trim());
        const all = window.RULES || [];
        if (!all.length) {
          const msg = '<div class="hub-empty">فهرست بارگذاری نشد. صفحه را دوباره بارگیری کنید.</div>';
          deckGrid.innerHTML = posterGrid.innerHTML = msg; foot.textContent = ''; return;
        }

        const match = r => !f || norm(r.title + ' ' + r.badge + ' ' + r.desc).includes(f);

        const decks = all.filter(r => r.type !== 'poster' && match(r));
        const posters = all.filter(r => r.type === 'poster' && match(r));

        deckGrid.innerHTML = decks.length
          ? decks.map(cardHTML).join('')
          : '<div class="hub-empty">ارائه‌ای یافت نشد.</div>';
        posterGrid.innerHTML = posters.length
          ? posters.map(cardHTML).join('')
          : '<div class="hub-empty">لوحی یافت نشد.</div>';

        countDeck.textContent = decks.length ? `${decks.length} مورد` : '';
        countPoster.textContent = posters.length ? `${posters.length} مورد` : '';

        /* اگر جستجو فعال است، بخش‌های خالی را پنهان کن */
        secDeck.style.display = decks.length || !f ? '' : 'none';
        secPoster.style.display = posters.length || !f ? '' : 'none';

        const total = decks.length + posters.length;
        foot.textContent = f
          ? `${total} نتیجه برای «${filter}»`
          : `${decks.length} ارائهٔ تعاملی + ${posters.length} لوح آموزشی`;
      }

      render('');
      search.addEventListener('input', e => render(e.target.value));

      /* تم روشن/تیره */
      const btn = document.getElementById('hubTheme');
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        btn.textContent = t === 'dark' ? '☀️' : '🌙';
        try { localStorage.setItem('amr-theme', t); } catch (e) {}
      }
      let saved = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      try { saved = localStorage.getItem('amr-theme') || saved; } catch (e) {}
      applyTheme(saved);
      btn.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
<script src="assets/register-sw.js"></script>
</body>
</html>
